name: "IKKO Mind One"
codename: "MindOne"
formfactor: "phone"
user_actions:
  bootloader:
    title: "Reboot to Bootloader mode"
    description: 'With the device powered off, hold Volume Up + Power. When prompted select "Fastboot" as the boot mode using Volume Up and confirm with Volume Down.'
    image: "phone_power_up"
    button: true
  recovery:
    title: "Reboot to Recovery mode"
    description: 'With the device powered off, hold Volume Up + Power. When prompted select "Recovery" as the boot mode using Volume Up and confirm with Volume Down.'
    image: "phone_power_up"
    button: true
handlers:
  bootloader_locked:
    actions:
      - fastboot:flashing_unlock:
operating_systems:
  - name: "Ubuntu Touch"
    compatible_installer: ">=0.9.2-beta"
    options:
      - var: "channel"
        name: "Channel"
        tooltip: "The release channel"
        link: "https://docs.ubports.com/en/latest/about/process/release-schedule.html"
        type: "select"
        remote_values:
          systemimage:channels:
      - var: "wipe"
        name: "Wipe Userdata"
        tooltip: "Wipe personal data. *Required* if switching from something (e.g. Android) that isn't Ubuntu Touch."
        type: "checkbox"
      - var: "bootstrap"
        name: "Bootstrap"
        tooltip: "Flash system partitions using fastboot. Do NOT uncheck unless you know exactly what you're doing!"
        type: "checkbox"
        value: true
    prerequisites: []
    steps:
      - actions:
          - core:user_action:
              action: "bootloader"
        condition:
          OR:
            - var: "bootstrap"
              value: true
            - var: "wipe"
              value: true

      - actions:
          # latest artifacts from https://gitlab.com/ubports/porting/community-ports/android12/ikko-mindone/ikko-mindone
          - core:download:
              group: "firmware"
              files:
                - url: "https://gitlab.com/api/v4/projects/84870091/jobs/artifacts/main/download?job=build"
                  name: "artifacts.zip"
          - core:unpack:
              group: "firmware"
              files:
                - archive: "artifacts.zip"
                  dir: "unpacked"
          - core:unpack:
              group: "firmware"
              files:
                - archive: "unpacked/out/device_MindOne.tar.xz"
                  dir: "unpacked"
          - core:unpack:
              group: "firmware"
              files:
                - archive: "unpacked/device_MindOne.tar"
                  dir: "unpacked"
        condition:
          var: "bootstrap"
          value: true

      - actions:
          - fastboot:set_active:
              slot: "a"
          - fastboot:flash:
              partitions:
                - partition: "boot_a"
                  file: "unpacked/partitions/boot.img"
                  group: "firmware"
        condition:
          var: "bootstrap"
          value: true

      - actions:
          - fastboot:format:
              partition: "userdata"
              type: "ext4"
        condition:
          var: "wipe"
          value: true

      - actions:
          - fastboot:reboot_recovery:
        fallback:
          - core:user_action:
              action: "recovery"

      - actions:
          - systemimage:install:
      - actions:
          - adb:reboot:
              to_state: "recovery"
        fallback:
          - core:user_action:
              action: "recovery"
    slideshow: []
