name: "Fairphone 3/3+"
codename: "FP3"
formfactor: "phone"
aliases: ["fp3"]
doppelgangers: []
user_actions:
  confirm_model:
    title: "Confirm your model"
    description: "Please check that your device is a Fairphone 3 (FP3) or Fairphone 3+ (FP3+)."
  confirm_os:
    title: "Confirm OS version"
    description: >
      Your device must be running the Fairphone OS version of Android 10 before installing Ubuntu Touch. With a previously installed /e/ OS, it won't work!
    link: "https://support.fairphone.com/hc/en-us/articles/18896094650513-Installing-Fairphone-OS-Manually"
  bootloader:
    title: "Reboot to Bootloader"
    description: >
      With the device powered off, press and hold the VOLUME DOWN and POWER buttons at the same time until the phone vibrates. 
      After some seconds you'll see the fastboot mode. Or just reboot and press and hold VOLUME DOWN BUTTON while rebooting.
    image: "phone_power_down"
    button: true
  recovery:
    title: "Reboot to Recovery"
    description: >
      With the device still at the "Fastboot Mode" (green), use the Volume buttons to switch to "Recovery Mode" (red) and push the power button to confirm your selection.
    image: "phone_power_up"
    button: true
  lvm-migration:
    title: "LVM Migration"
    description: >
      On first install of the new recovery, we need to increase the available size for the rootfs.
        When recovery is booted, wait until "lvm-migration" is finished. Watch the log output in the bottom of the device.
        If there is no output at all or when it displays, that it is finished, push the "Continue"-Button in the installer.
    button: true
unlock:
  - "confirm_model"
  - "confirm_os"
handlers:
  bootloader_locked:
    actions:
      - fastboot:oem_unlock:
          code_url: "https://www.fairphone.com/en/bootloader-unlocking-code-for-fairphone/"
operating_systems:
  - name: "Ubuntu Touch"
    compatible_installer: ">=0.9.4-beta"
    options:
      - var: "channel"
        name: "Channel"
        tooltip: "The release channel"
        link: "https://docs.ubports.com/en/latest/about/process/release-schedule.html"
        type: "select"
        remote_values:
          systemimage:channels:
      - var: "wipe"
        name: "Wipe Userdata"
        tooltip: "Wipe personal data. This is necessary, for first time installations."
        type: "checkbox"
      - var: "bootstrap"
        name: "Bootstrap"
        tooltip: "Flash system partitions using fastboot"
        type: "checkbox"
        value: true
    prerequisites: []
    steps:
      - actions:
          # latest artifacts from https://gitlab.com/ubports/porting/community-ports/android10/fairphone/fairphone_fp3
          - core:download:
              group: "firmware"
              files:
                - url: "https://gitlab.com/api/v4/projects/22012040/jobs/artifacts/halium-10.0-focal/download?job=build"
                  name: "artifacts.zip"
          - core:unpack:
              group: "firmware"
              files:
                - archive: "artifacts.zip"
                  dir: "unpacked"
          - core:unpack:
              group: "firmware"
              files:
                - archive: "unpacked/out/device_FP3.tar.xz"
                  dir: "unpacked"
          - core:unpack:
              group: "firmware"
              files:
                - archive: "unpacked/device_FP3.tar"
                  dir: "unpacked"
        condition:
          var: "bootstrap"
          value: true
      - actions:
          - adb:reboot:
              to_state: "bootloader"
        fallback:
          - core:user_action:
              action: "bootloader"
      - actions:
          - fastboot:flash:
              partitions:
                - partition: "boot"
                  file: "unpacked/partitions/boot.img"
                  group: "firmware"
                  raw: true
        condition:
          var: "bootstrap"
          value: true
      - actions:
          - fastboot:erase:
              partition: "userdata"
        condition:
          var: "wipe"
          value: true
      - actions:
          - fastboot:format:
              partition: "userdata"
              type: "ext4"
        condition:
          var: "wipe"
          value: true
      - actions:
          - adb:reboot:
              to_state: "recovery"
        fallback:
          - core:user_action:
              action: "recovery"
      - actions:
          - core:user_action:
              action: "lvm-migration"
        condition:
          var: "bootstrap"
          value: true
      - actions:
          - systemimage:install:
              verify_recovery: true
      - actions:
          - adb:reboot:
              to_state: "recovery"
        fallback:
          - core:user_action:
              action: "recovery"
    slideshow: []
