name: "Zinwa Q25"
codename: "Q25"
formfactor: "phone"
aliases:
  - "q20_v12_factory"
user_actions:
  confirm_fw:
    title: "Confirm OS version"
    description: "Your device must be running (ideally latest mass production) Android 14 firmware linked below on slot A before installing Ubuntu Touch. Easiest way to achieve this is by flashing the device in 'Firmware Upgrade' mode of SP Flash Tool v6 and then unlocking the bootloader as usual."
    link: "https://drive.zinwa.com/"
    button: true
  unlock_phone:
    title: "Unlock the bootloader"
    description: "Before installing Ubuntu Touch you must unlock the bootloader of your phone manually. Follow the steps in the linked page (excluding the final reboot) if you haven't already."
    link: "https://duc1607.notion.site/Unlock-Bootloader-2a5709b7d17c8078afc5cbfbed3c2cf1"
  bootloader:
    title: "Reboot to Bootloader mode"
    description: 'With the device powered off, hold Volume Up + Power. When prompted select "Fastboot" as the boot mode using Volume Up and confirm with Volume Down.'
    image: "phone_power_up"
    button: true
  recovery:
    title: "Reboot to Recovery mode"
    description: 'With the device powered off, hold Volume Up + Power. When prompted select "Recovery" as the boot mode using Volume Up and confirm with Volume Down.'
    image: "phone_power_up"
    button: true
unlock:
  - "unlock_phone"
handlers:
  bootloader_locked:
    actions:
      - fastboot:flashing_unlock:
operating_systems:
  - name: "Ubuntu Touch"
    compatible_installer: ">=0.9.2-beta"
    options:
      - var: "channel"
        name: "Channel"
        tooltip: "The release channel"
        link: "https://docs.ubports.com/en/latest/about/process/release-schedule.html"
        type: "select"
        remote_values:
          systemimage:channels:
      - var: "wipe"
        name: "Wipe Userdata"
        tooltip: "Wipe personal data. *Required* if switching from something (e.g. Android) that isn't Ubuntu Touch."
        type: "checkbox"
      - var: "bootstrap"
        name: "Bootstrap"
        tooltip: "Flash system partitions using fastboot. Do NOT uncheck unless you know exactly what you're doing!"
        type: "checkbox"
        value: true
    prerequisites: []
    steps:
      - actions:
          - core:user_action:
              action: "confirm_fw"
        condition:
          var: "bootstrap"
          value: true

      # Handle initial bootstrap/userdata wipe in bootloader mode
      ##################################################################
      - actions:
# FIXME: bring below back once "adb reboot bootloader" unbroken on UT side
#          - adb:reboot:
#              to_state: "bootloader"
#        fallback:
          - core:user_action:
              action: "bootloader"
        condition:
          OR:
            - var: "bootstrap"
              value: true
            - var: "wipe"
              value: true

      - actions:
          - fastboot:assert_var:
              variable: "unlocked"
              value: "yes"
        fallback:
          - core:user_action:
              action: "unlock_phone"
        condition:
          OR:
            - var: "bootstrap"
              value: true
            - var: "wipe"
              value: true

      - actions:
          - core:download:
              group: "firmware"
              files:
                - url: "https://gitlab.com/ubports/porting/community-ports/android12/zinwa-q25/zinwa-q25/-/package_files/380305291/download" # 20261030
                  name: "bootstrap.zip"
                  checksum:
                    sum: "1ecc994e182449536edce1f030afba7712e7bff1202741e1e9ccd4daf8d6f0f4"
                    algorithm: "sha256"
          - core:unpack:
              group: "firmware"
              files:
                - archive: "bootstrap.zip"
                  dir: "unpacked"
        condition:
          var: "bootstrap"
          value: true

      - actions:
          - fastboot:set_active:
              slot: "a"
          - fastboot:flash:
              partitions:
                - partition: "boot_a"
                  file: "unpacked/boot.img"
                  group: "firmware"
        condition:
          var: "bootstrap"
          value: true

      # Optionally wipe userdata (too)
      - actions:
          - fastboot:format:
              partition: "userdata"
              type: "ext4"
        condition:
          var: "wipe"
          value: true

      # Install UT
      ##################################################################
      - actions:
          - fastboot:reboot_recovery:
        fallback:
          - core:user_action:
              action: "recovery"

      - actions:
          - systemimage:install:
      - actions:
          - adb:reboot:
              to_state: "recovery"
        fallback:
          - core:user_action:
              action: "recovery"
    slideshow: []
