name: "Google Pixel 9a"
codename: "tegu"
formfactor: "phone"
aliases: ["tegu"]
doppelgangers: []
user_actions:
  confirm_model:
    title: "Confirm your model"
    description: "Please check that your device is a Pixel 9a (tegu)."
  confirm_os:
    title: "Confirm OS version"
    description: "Your device must be running the last version of Android 16 (CP1A.260505.005 for worldwide models) before installing another operating system. With a previously installed custom ROM, it won't work!"
    link: "https://developers.google.com/android/images#tegu"
  unlock_phone:
    title: "Unlock the bootloader"
    description: "Before installing another operating system you must unlock the bootloader of your phone manually. Follow the steps in the linked page if you haven't already."
  bootloader:
    title: "Reboot to Bootloader"
    description: "With the device powered off, press and hold the Power and the Volume Down buttons until a menu appears. You'll see the fastboot mode."
    image: "phone_power_down"
    button: true
  recovery:
    title: "Reboot to Recovery"
    description: 'With the device still at the "FastBoot Mode", use the Volume buttons to switch to "Recovery Mode" and push the power button to confirm your selection.'
    image: "phone_power_up"
    button: true
unlock:
  - "confirm_model"
  - "confirm_os"
  - "unlock_phone"
operating_systems:
  - name: "Ubuntu Touch"
    compatible_installer: ">=0.9.6-beta"
    options:
      - var: "channel"
        name: "Channel"
        tooltip: "The release channel"
        link: "https://docs.ubports.com/en/latest/about/process/release-schedule.html"
        type: "select"
        remote_values:
          systemimage:channels:
      - var: "wipe"
        name: "Wipe Userdata"
        tooltip: "Wipe personal data. This is necessary for first time installations."
        type: "checkbox"
      - var: "bootstrap"
        name: "Bootstrap"
        tooltip: "Flash system partitions using fastboot"
        type: "checkbox"
        value: true
    prerequisites: []
    steps:
      ### Ensure we always start in bootloader mode
      - actions:
          - adb:reboot:
              to_state: "bootloader"
        fallback:
          - core:user_action:
              action: "bootloader"
      ### Ensure the bootloader has been unlocked already
      - actions:
          - fastboot:wait:
      - actions:
          - fastboot:assert_var:
              variable: "unlocked"
              value: "yes"
        fallback:
          - core:user_action:
              action: "unlock_phone"
      ### As this is an A/B device, force all future operations in "a" slot.
      - actions:
          - fastboot:set_active:
              slot: "a"
      ### Flash important partitions (if requested)
      - actions:
          - core:download:
              group: "firmware"
              files:
                - url: "https://cdimage.ubports.com/devices/tegu/2026-09-07/boot.img"
                  checksum:
                    sum: "f0fd5760b60dd35bc2f5ffd8241a94199b6d83b10dd071297e337ca96a09fe00"
                    algorithm: "sha256"
                - url: "https://cdimage.ubports.com/devices/tegu/2026-09-07/vendor_boot.img"
                  checksum:
                    sum: "9d040523f9c67c3badb9415dd829bdeee3a9de95233c86fe5a4e55b425239833"
                    algorithm: "sha256"
                - url: "https://cdimage.ubports.com/devices/tegu/2026-09-07/dtbo.img"
                  checksum:
                    sum: "91def60a6759fe5a5dc1ec37a062e131ecaef6883dbba8f4e6ce5e654a0645e3"
                    algorithm: "sha256"
                - url: "https://cdimage.ubports.com/devices/tegu/2026-09-07/init_boot.img"
                  checksum:
                    sum: "84377ccd1faab9228bb187bc3a44fe8a049d12aaa2a5f82da34716791186b8e1"
                    algorithm: "sha256"
                - url: "https://cdimage.ubports.com/devices/tegu/2026-09-07/vendor_kernel_boot.img"
                  checksum:
                    sum: "0d0ed17c730d742776ebde2c01c1ba37848c3e321c46e898d53c5f8c7172e6c1"
                    algorithm: "sha256"

        condition:
          var: "bootstrap"
          value: true
      - actions:
          - fastboot:flash:
              partitions:
                - partition: "boot"
                  file: "boot.img"
                  group: "firmware"
                - partition: "dtbo"
                  file: "dtbo.img"
                  group: "firmware"
                - partition: "init_boot"
                  file: "init_boot.img"
                  group: "firmware"
                - partition: "vendor_boot"
                  file: "vendor_boot.img"
                  group: "firmware"
                - partition: "vendor_kernel_boot"
                  file: "vendor_kernel_boot.img"
                  group: "firmware"
        condition:
          var: "bootstrap"
          value: true
      ### Wipe userdata (if requested)
      - actions:
          - fastboot:erase:
              partition: "userdata"
        condition:
          var: "wipe"
          value: true
      - actions:
          - fastboot:format:
              partition: "userdata"
              type: "ext4"
        condition:
          var: "wipe"
          value: true
      ### Systemimage installation steps
      - actions:
          - fastboot:reboot_recovery:
        fallback:
          - core:user_action:
              action: "recovery"
      - actions:
          - systemimage:install:
              verify_recovery: true
      - actions:
          - adb:reboot:
              to_state: "recovery"
        fallback:
          - core:user_action:
              action: "recovery"
    slideshow: []
