name: "Xiaomi Mi A3"
codename: "laurel_sprout"
formfactor: "phone"
aliases: []
doppelgangers: []
user_actions:
  confirm_model:
    title: "Confirm your model"
    description: "Please double-check that your device is a Xiaomi Mi A3 (laurel_sprout). Xiaomi Mi CC9e is NOT supported."
  confirm_os:
    title: "Confirm OS version"
    description: "Your device must be running the stock Android 11 firmware (MIUI V12.0.26.0.RFQMIXM) before flashing. If your device is running Android 9 or 10, download the Android 11 firmware linked below, flash it to your device, then resume the installation."
    link: "https://bn.d.miui.com/V12.0.26.0.RFQMIXM/laurel_sprout_global_images_V12.0.26.0.RFQMIXM_20220808.0000.00_11.0_2292e2c0b1.tgz"
  bootloader:
    title: "Reboot to Bootloader"
    description: "With the device powered off, press and hold the VOLUME DOWN and POWER buttons until the screen turns on"
    image: "phone_power_down"
    button: true
  recovery:
    title: "Reboot to Recovery"
    description: "With the device still at the 'Fastboot' screen, press and hold VOLUME UP and POWER buttons until the screen turns on"
    image: "phone_power_up"
    button: true
  boot:
    title: "Reboot the device"
    description: "Hold down the power button until the device powers down. Then, release it briefly and hold it down again until the device boots."
    button: true
unlock:
  - "confirm_model"
  - "confirm_os"
handlers:
  bootloader_locked:
    actions:
      - fastboot:flashing_unlock:
operating_systems:
  - name: "Ubuntu Touch"
    compatible_installer: ">=0.9.2-beta"
    options:
      - var: "channel"
        name: "Channel"
        tooltip: "The release channel"
        link: "https://docs.ubports.com/en/latest/about/process/release-schedule.html"
        type: "select"
        remote_values:
          systemimage:channels:
      - var: "wipe"
        name: "Wipe Userdata"
        tooltip: "Wipe personal data"
        type: "checkbox"
      - var: "bootstrap"
        name: "Bootstrap"
        tooltip: "Flash system partitions using fastboot"
        type: "checkbox"
        value: true
    prerequisites: []
    steps:
      - actions:
          - core:download:
              group: "firmware"
              files:
                - url: "https://github.com/nikhilsamant/laurel-sprout/releases/download/UT-24.04-1.x_v4/boot.img"
                  checksum:
                    sum: "88033a79e7caef5f5349e9a9bf84bc6a6e02023255d704dbf4df50ba90b765b3"
                    algorithm: "sha256"
                - url: "https://github.com/nikhilsamant/laurel-sprout/releases/download/UT-24.04-1.x_v4/dtbo.img"
                  checksum:
                    sum: "e32bfe561cde7e26b8bb3ae126e40fc3da35c7b056e53953b1c125f2560aabf9"
                    algorithm: "sha256"
        condition:
          var: "bootstrap"
          value: true
      - actions:
          - adb:reboot:
              to_state: "bootloader"
        fallback:
          - core:user_action:
              action: "bootloader"
        condition:
          var: "bootstrap"
          value: true
      - actions:
          - fastboot:set_active:
              slot: "a"
        condition:
          var: "bootstrap"
          value: true
      - actions:
          - fastboot:format:
              partition: "system"
              type: "ext4"
        condition:
          var: "bootstrap"
          value: true
      - actions:
          - fastboot:format:
              partition: "userdata"
              type: "ext4"
        condition:
          var: "wipe"
          value: true
      - actions:
          - fastboot:flash:
              partitions:
                - partition: "boot_a"
                  file: "boot.img"
                  group: "firmware"
        condition:
          var: "bootstrap"
          value: true
      - actions:
          - adb:reboot:
              to_state: "recovery"
        fallback:
          - core:user_action:
              action: "recovery"
      - actions:
          - systemimage:install:
      - actions:
          - core:user_action:
              action: "bootloader"
        condition:
          var: "bootstrap"
          value: true
      - actions:
          - fastboot:flash:
              partitions:
                - partition: "dtbo_a"
                  file: "dtbo.img"
                  group: "firmware"
        condition:
          var: "bootstrap"
          value: true
      - actions:
          - adb:reboot:
              to_state: "recovery"
        fallback:
          - core:user_action:
              action: "recovery"
    slideshow: []
  - name: "Reflash dtbo"
    compatible_installer: ">=0.9.2-beta"
    prerequisites: []
    steps:
      - actions:
          - core:download:
              group: "firmware"
              files:
                - url: "https://github.com/nikhilsamant/laurel-sprout/releases/download/UT-24.04-1.x_v4/dtbo.img"
                  checksum:
                    sum: "e32bfe561cde7e26b8bb3ae126e40fc3da35c7b056e53953b1c125f2560aabf9"
                    algorithm: "sha256"
      - actions:
          - adb:reboot:
              to_state: "bootloader"
        fallback:
          - core:user_action:
              action: "bootloader"
      - actions:
          - fastboot:flash:
              partitions:
                - partition: "dtbo"
                  file: "dtbo.img"
                  group: "firmware"
      - actions:
          - fastboot:reboot:
        fallback:
          - core:user_action:
              action: "boot"
    slideshow: []
